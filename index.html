<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memory Matching Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#0d1a2b;--moon:#f4f0e8;--lagoon:#46bfae;--mist:#b9a8f2;--line:#ffffff38;--glass:#ffffff16;--card:clamp(54px,12vw,104px)}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:linear-gradient(150deg,#0d1a2b,#123a4a 60%,#1b4f57);color:var(--moon);font:16px Figtree,system-ui;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:45vmax;height:45vmax;border-radius:50%;filter:blur(80px);opacity:.3;z-index:-1;pointer-events:none;animation:drift 24s ease-in-out infinite alternate}
body:before{background:var(--lagoon);top:-20vmax;left:-15vmax}body:after{background:var(--mist);right:-18vmax;bottom:-20vmax;animation-direction:alternate-reverse}@keyframes drift{to{transform:translate(12vmax,10vmax) scale(1.2)}}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px}h1,h2{font-family:"Young Serif",Georgia,serif;font-weight:400;margin:0}h2{font-size:1.3rem}.stats,.tools{display:flex;align-items:center;gap:9px}.pill,.btn{border:1px solid var(--line);background:var(--glass);color:var(--moon);border-radius:999px;padding:9px 15px;backdrop-filter:blur(12px)}.btn{font:inherit;cursor:pointer}.btn:hover{background:#ffffff30}main{min-height:70svh;display:grid;place-items:center;padding:20px}#board{display:grid;gap:clamp(7px,1.5vw,12px);justify-content:center}.card{width:var(--card);height:var(--card);border:0;background:none;padding:0;perspective:700px;cursor:pointer}.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.4,1)}.card.open .inner,.card.done .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:22%;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}.front{border:1px solid var(--line);background:repeating-radial-gradient(circle,transparent 0 8px,#ffffff20 9px 10px),#ffffff18;box-shadow:0 8px 22px #0004}.back{transform:rotateY(180deg);background:linear-gradient(145deg,#fbf6ea,#e9e1f7);font-size:calc(var(--card)*.48);box-shadow:0 0 22px #b9a8f277}.done .back{box-shadow:0 0 28px #46bfaeaa}.card:focus-visible,.btn:focus-visible{outline:3px solid #ffbfa3;outline-offset:4px}
#veil{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:#0d1a2b88;backdrop-filter:blur(10px);transition:opacity .4s}#veil.hide{opacity:0;pointer-events:none}.panel{width:min(520px,100%);text-align:center;padding:32px 24px;border:1px solid var(--line);border-radius:28px;background:#ffffff19;box-shadow:0 25px 70px #0006}.panel h1{font-size:clamp(2rem,8vw,3rem)}.panel p{line-height:1.6;color:#f4f0e8d9}.modes{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}.mode{border:0;border-radius:16px;padding:12px 16px;min-width:92px;background:var(--moon);color:var(--ink);font:inherit;cursor:pointer}.mode b,.mode small{display:block}.mode small{opacity:.65;margin-top:3px}@media(max-width:600px){header{justify-content:center}header h2{display:none}.tools{width:100%;justify-content:center}main{min-height:65svh}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body>
<header><h2>Memory Matching</h2><div class="stats"><span class="pill" id="moves">Moves 0</span><span class="pill" id="time">0:00</span></div><div class="tools"><button class="btn" id="sound">Music on</button><button class="btn" id="new">New game</button></div></header>
<main><div id="board" aria-label="Memory cards"></div></main><div id="veil"><section class="panel" id="panel"></section></div>
<script>
const EMOJI=["💐","🌹","🌻","🏵️","🌺","🌴","🌈","🍓","🍒","🍎","🍉","🍊","🥭","🍍","🍋","🍏","🍐","🥝","🍇","🥥","🍅","🌶️","🍄","🧅","🥦","🥑","🍔","🍕","🧁","🎂","🍬","🍩","🍫","🎈"];
const MODES=[{r:3,c:4,n:"Gentle"},{r:4,c:4,n:"Easy"},{r:4,c:5,n:"Medium"},{r:5,c:6,n:"Hard"},{r:6,c:6,n:"Expert"}];
const $=s=>document.querySelector(s),board=$("#board"),veil=$("#veil"),panel=$("#panel");
let mode=MODES[1],first=null,locked=false,left=0,moves=0,seconds=0,timer=null,started=false,soundOn=true,audio=null;
function menu(title,description){panel.innerHTML='<h1>'+title+'</h1><p>'+description+'</p><div class="modes">'+MODES.map((m,i)=>'<button class="mode" data-i="'+i+'"><b>'+m.n+'</b><small>'+m.r+' × '+m.c+'</small></button>').join("")+'</div>';panel.querySelectorAll("button").forEach(b=>b.onclick=()=>start(MODES[+b.dataset.i]));veil.classList.remove("hide")}
function clock(){return Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0")}
function start(m){mode=m;clearInterval(timer);moves=seconds=0;first=null;locked=started=false;left=m.r*m.c/2;$("#moves").textContent="Moves 0";$("#time").textContent="0:00";let pair=[...EMOJI].sort(()=>Math.random()-.5).slice(0,left),deck=[...pair,...pair].sort(()=>Math.random()-.5);board.innerHTML="";let cols=innerWidth<600?Math.min(m.r,m.c):m.c;board.style.gridTemplateColumns="repeat("+cols+",var(--card))";deck.forEach((emoji,i)=>{let b=document.createElement("button");b.className="card";b.setAttribute("aria-label","Hidden card "+(i+1));b.innerHTML='<span class="inner"><span class="face front"></span><span class="face back">'+emoji+'</span></span>';b.dataset.value=emoji;b.onclick=()=>flip(b);board.append(b)});veil.classList.add("hide")}
function flip(card){if(locked||card.classList.contains("open")||card.classList.contains("done"))return;if(!started){started=true;timer=setInterval(()=>{$("#time").textContent=clock();seconds++},1000)}card.classList.add("open");card.setAttribute("aria-label",card.dataset.value);if(!first){first=card;return}moves++;$("#moves").textContent="Moves "+moves;locked=true;let a=first;first=null;if(a.dataset.value===card.dataset.value){setTimeout(()=>{[a,card].forEach(x=>{x.classList.remove("open");x.classList.add("done")});left--;locked=false;if(!left){clearInterval(timer);let key="memory-best-"+mode.r+"x"+mode.c,best=JSON.parse(localStorage.getItem(key)||"null"),record=!best||moves<best.moves;if(record)localStorage.setItem(key,JSON.stringify({moves,seconds}));setTimeout(()=>menu("All pairs found!","You finished in "+moves+" moves and "+clock()+". "+(record?"New personal best!":"Keep practising to beat your best.") ),450)}},550)}else setTimeout(()=>{[a,card].forEach(x=>{x.classList.remove("open");x.setAttribute("aria-label","Hidden card")});locked=false},950)}
$("#new").onclick=()=>{clearInterval(timer);menu("New game","Choose a board size to begin.")};$("#sound").onclick=()=>{soundOn=!soundOn;$("#sound").textContent=soundOn?"Music on":"Music off";if(audio)audio.gain.setTargetAtTime(soundOn?.035:0,audio.context.currentTime,.1)};
function ambience(){try{let context=new(window.AudioContext||window.webkitAudioContext)(),gain=context.createGain(),osc=context.createOscillator();gain.gain.value=soundOn?.025:0;osc.type="sine";osc.frequency.value=110;osc.connect(gain);gain.connect(context.destination);osc.start();audio={context,gain}}catch(e){}}
document.addEventListener("pointerdown",()=>{if(!audio)ambience()},{once:true});menu("Memory Matching Game","Flip two cards at a time and find every matching pair. Take a breath and enjoy the game. Pick a board size."); 
</script></body></html>
